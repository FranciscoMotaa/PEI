<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580">
  <rect width="960" height="580" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="36" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Arquitetura do Sistema — Classificação Passiva de Tráfego IoT Encriptado</text>
  <text x="480" y="56" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Observação exclusiva de metadados da camada de transporte (sem DPI)</text>

  <!-- Layer labels -->
  <text x="20" y="100" font-family="Arial" font-size="10" font-weight="bold" fill="#94a3b8" letter-spacing="1">CAMADA A — GERAÇÃO</text>
  <text x="380" y="100" font-family="Arial" font-size="10" font-weight="bold" fill="#94a3b8" letter-spacing="1">CAMADA B — CAPTURA</text>
  <text x="620" y="100" font-family="Arial" font-size="10" font-weight="bold" fill="#94a3b8" letter-spacing="1">CAMADA C — ML</text>
  <text x="820" y="100" font-family="Arial" font-size="10" font-weight="bold" fill="#94a3b8" letter-spacing="1">CAMADA D</text>

  <!-- Device 1 -->
  <rect x="30" y="120" width="150" height="55" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="143" font-family="Arial" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Device 1 (172.20.0.10)</text>
  <text x="105" y="162" font-family="Arial" font-size="11" fill="#3b82f6" text-anchor="middle">Telemetria Periódica</text>

  <!-- Device 2 -->
  <rect x="30" y="190" width="150" height="55" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="105" y="213" font-family="Arial" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">Device 2 (172.20.0.11)</text>
  <text x="105" y="232" font-family="Arial" font-size="11" fill="#f97316" text-anchor="middle">Event-Driven</text>

  <!-- Device 3 -->
  <rect x="30" y="260" width="150" height="55" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="105" y="283" font-family="Arial" font-size="12" font-weight="bold" fill="#6d28d9" text-anchor="middle">Device 3 (172.20.0.12)</text>
  <text x="105" y="302" font-family="Arial" font-size="11" fill="#8b5cf6" text-anchor="middle">Firmware OTA</text>

  <!-- Broker -->
  <rect x="240" y="160" width="160" height="100" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="195" font-family="Arial" font-size="14" font-weight="bold" fill="#5b21b6" text-anchor="middle">Mosquitto Broker</text>
  <text x="320" y="215" font-family="Arial" font-size="11" fill="#7c3aed" text-anchor="middle">MQTT over TLS</text>
  <text x="320" y="235" font-family="Arial" font-size="11" fill="#7c3aed" text-anchor="middle">Porta 8883</text>
  <text x="320" y="252" font-family="Arial" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">Payload 100% cifrado</text>

  <!-- Connections Devices → Broker (encrypted) -->
  <path d="M 180 147 L 232 190" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <path d="M 180 217 L 232 210" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <path d="M 180 287 L 232 240" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- NFStream Capture -->
  <rect x="430" y="140" width="160" height="80" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="510" y="168" font-family="Arial" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">NFStream</text>
  <text x="510" y="186" font-family="Arial" font-size="10" fill="#dc2626" text-anchor="middle">Captura passiva (eth0)</text>
  <text x="510" y="202" font-family="Arial" font-size="10" fill="#dc2626" text-anchor="middle">active_timeout = 10s</text>
  <text x="510" y="215" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">BPF: tcp port 8883</text>

  <!-- Connection Broker → NFStream (tap) -->
  <path d="M 400 200 L 422 180" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="412" y="175" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">tap</text>

  <!-- Features box -->
  <rect x="430" y="250" width="160" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="270" font-family="Arial" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">6 Features Extraídas</text>
  <text x="445" y="290" font-family="Courier New" font-size="9" fill="#334155">num_packets</text>
  <text x="445" y="305" font-family="Courier New" font-size="9" fill="#334155">avg_size</text>
  <text x="445" y="320" font-family="Courier New" font-size="9" fill="#334155">std_size</text>
  <text x="540" y="290" font-family="Courier New" font-size="9" fill="#334155">avg_iat</text>
  <text x="540" y="305" font-family="Courier New" font-size="9" fill="#334155">std_iat</text>
  <text x="540" y="320" font-family="Courier New" font-size="9" fill="#334155">total_bytes</text>
  <text x="510" y="350" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">Observáveis sem decifrar payload</text>

  <!-- Connection NFStream → Features -->
  <path d="M 510 220 L 510 242" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Random Forest -->
  <rect x="640" y="155" width="150" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="182" font-family="Arial" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Random Forest</text>
  <text x="715" y="200" font-family="Arial" font-size="10" fill="#16a34a" text-anchor="middle">200 estimadores</text>
  <text x="715" y="216" font-family="Arial" font-size="10" fill="#16a34a" text-anchor="middle">class_weight=balanced</text>
  <text x="715" y="235" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Inferência: ~68ms/amostra</text>

  <!-- Connection Features → RF -->
  <path d="M 590 300 L 620 300 L 620 200 L 632 200" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- SQLite -->
  <rect x="650" y="280" width="130" height="55" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="715" y="305" font-family="Arial" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">SQLite</text>
  <text x="715" y="322" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">iot_traffic.db</text>

  <!-- Connection RF → SQLite -->
  <path d="M 715 245 L 715 272" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Dashboard -->
  <rect x="830" y="170" width="110" height="70" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="885" y="198" font-family="Arial" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">Dashboard</text>
  <text x="885" y="216" font-family="Arial" font-size="10" fill="#d97706" text-anchor="middle">Flask :8080</text>
  <text x="885" y="232" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">Tempo real</text>

  <!-- Connection SQLite → Dashboard -->
  <path d="M 780 307 L 830 250" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- tc netem -->
  <rect x="30" y="350" width="150" height="55" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="105" y="373" font-family="Arial" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">tc netem</text>
  <text x="105" y="392" font-family="Arial" font-size="10" fill="#dc2626" text-anchor="middle">Delay + Loss (Docker SDK)</text>

  <!-- Connection tc netem → Devices -->
  <path d="M 105 350 L 105 323" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

  <!-- Legend -->
  <rect x="30" y="440" width="900" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="462" font-family="Arial" font-size="10" font-weight="bold" fill="#475569">Legenda:</text>
  <line x1="110" y1="458" x2="150" y2="458" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="158" y="462" font-family="Arial" font-size="10" fill="#334155">Tráfego encriptado (payload inacessível)</text>
  <line x1="380" y1="458" x2="420" y2="458" stroke="#16a34a" stroke-width="2"/>
  <text x="428" y="462" font-family="Arial" font-size="10" fill="#334155">Fluxo de metadados (features observáveis)</text>
  <line x1="660" y1="458" x2="700" y2="458" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="708" y="462" font-family="Arial" font-size="10" fill="#334155">Leitura de resultados</text>

  <text x="50" y="486" font-family="Arial" font-size="10" fill="#64748b">Rede Docker isolada: 172.20.0.0/24 (iot-net) · IPs fixos para ground truth · Sem inspeção de payload em nenhum ponto do pipeline</text>

  <!-- Network label -->
  <rect x="220" y="80" width="140" height="20" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="290" y="94" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">iot-net (172.20.0.0/24)</text>
</svg>
