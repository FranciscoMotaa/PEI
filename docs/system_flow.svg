<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Pipeline de Classificação — Do Pacote à Decisão</text>

  <!-- Step 1: Device sends -->
  <rect x="30" y="70" width="130" height="100" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">1. Dispositivo</text>
  <text x="95" y="115" font-family="Arial" font-size="9" fill="#3b82f6" text-anchor="middle">Publica MQTT</text>
  <text x="95" y="130" font-family="Arial" font-size="9" fill="#3b82f6" text-anchor="middle">a cada 5s (telemetria)</text>
  <text x="95" y="145" font-family="Arial" font-size="9" fill="#3b82f6" text-anchor="middle">burst (event-driven)</text>
  <text x="95" y="160" font-family="Arial" font-size="9" fill="#3b82f6" text-anchor="middle">contínuo (firmware)</text>

  <!-- Step 2: TLS encryption -->
  <rect x="190" y="70" width="120" height="100" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="250" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">2. TLS</text>
  <text x="250" y="115" font-family="Arial" font-size="9" fill="#dc2626" text-anchor="middle">Payload cifrado</text>
  <text x="250" y="130" font-family="Arial" font-size="9" fill="#dc2626" text-anchor="middle">Conteúdo MQTT</text>
  <text x="250" y="145" font-family="Arial" font-size="9" fill="#dc2626" text-anchor="middle">inacessível</text>
  <text x="250" y="162" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">Headers TCP/IP visíveis</text>

  <!-- Step 3: NFStream -->
  <rect x="340" y="70" width="130" height="100" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="405" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">3. NFStream</text>
  <text x="405" y="115" font-family="Arial" font-size="9" fill="#f97316" text-anchor="middle">Agrupa em fluxos</text>
  <text x="405" y="130" font-family="Arial" font-size="9" fill="#f97316" text-anchor="middle">(5-tuple, 10s window)</text>
  <text x="405" y="148" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">Calcula estatísticas</text>
  <text x="405" y="162" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">bidirecionais</text>

  <!-- Step 4: Feature vector -->
  <rect x="500" y="70" width="130" height="100" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="565" y="92" font-family="Arial" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">4. Vetor de Features</text>
  <text x="520" y="112" font-family="Courier New" font-size="8" fill="#475569">num_packets: 198</text>
  <text x="520" y="125" font-family="Courier New" font-size="8" fill="#475569">avg_size:    300B</text>
  <text x="520" y="138" font-family="Courier New" font-size="8" fill="#475569">std_size:    221</text>
  <text x="520" y="151" font-family="Courier New" font-size="8" fill="#475569">avg_iat:     0.04s</text>
  <text x="520" y="164" font-family="Courier New" font-size="8" fill="#475569">std_iat:     0.02s</text>

  <!-- Step 5: Random Forest -->
  <rect x="660" y="70" width="130" height="100" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="725" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">5. Random Forest</text>
  <text x="725" y="115" font-family="Arial" font-size="9" fill="#16a34a" text-anchor="middle">predict(X)</text>
  <text x="725" y="133" font-family="Arial" font-size="9" fill="#16a34a" text-anchor="middle">predict_proba(X)</text>
  <text x="725" y="155" font-family="Arial" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">→ "firmware"</text>
  <text x="725" y="168" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">100% confiança</text>

  <!-- Step 6: Output -->
  <rect x="820" y="70" width="120" height="100" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="880" y="95" font-family="Arial" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">6. Resultado</text>
  <text x="880" y="115" font-family="Arial" font-size="9" fill="#d97706" text-anchor="middle">SQLite (persistência)</text>
  <text x="880" y="130" font-family="Arial" font-size="9" fill="#d97706" text-anchor="middle">Dashboard (live)</text>
  <text x="880" y="148" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">Classificação a cada</text>
  <text x="880" y="161" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">10s por dispositivo</text>

  <!-- Arrows between steps -->
  <path d="M 160 120 L 182 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 310 120 L 332 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 470 120 L 492 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 630 120 L 652 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M 790 120 L 812 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- What's visible vs hidden -->
  <rect x="30" y="200" width="430" height="50" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="245" y="222" font-family="Arial" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">O que está CIFRADO (inacessível ao classificador)</text>
  <text x="245" y="240" font-family="Arial" font-size="10" fill="#dc2626" text-anchor="middle">Conteúdo MQTT: JSON com temperatura, eventos, chunks de firmware — tudo opaco</text>

  <rect x="30" y="260" width="430" height="70" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="245" y="282" font-family="Arial" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">O que está VISÍVEL (usado pelo classificador)</text>
  <text x="245" y="300" font-family="Arial" font-size="10" fill="#16a34a" text-anchor="middle">Cabeçalhos IP/TCP: endereços, portos, tamanho do pacote, timestamps</text>
  <text x="245" y="318" font-family="Arial" font-size="10" fill="#16a34a" text-anchor="middle">Estatísticas de fluxo: contagem, médias, desvios padrão, volume total</text>

  <!-- Training pipeline (bottom) -->
  <text x="580" y="215" font-family="Arial" font-size="11" font-weight="bold" fill="#475569">Pipeline de Treino (offline)</text>

  <rect x="500" y="230" width="100" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="254" font-family="Arial" font-size="9" fill="#334155" text-anchor="middle">PCAP capturado</text>

  <path d="M 600 250 L 618 250" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>

  <rect x="625" y="230" width="100" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="675" y="248" font-family="Arial" font-size="9" fill="#334155" text-anchor="middle">NFStream offline</text>
  <text x="675" y="262" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">(mesmo config)</text>

  <path d="M 725 250 L 743 250" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>

  <rect x="750" y="230" width="100" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="800" y="248" font-family="Arial" font-size="9" fill="#334155" text-anchor="middle">Dataset (27k)</text>
  <text x="800" y="262" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">+ amostras degradadas</text>

  <path d="M 850 250 L 868 250" fill="none" stroke="#475569" stroke-width="1" marker-end="url(#a)"/>

  <rect x="875" y="230" width="70" height="40" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="910" y="248" font-family="Arial" font-size="9" fill="#166534" text-anchor="middle">train.py</text>
  <text x="910" y="262" font-family="Arial" font-size="8" fill="#64748b" text-anchor="middle">→ model.joblib</text>

  <!-- Connection train → RF (dashed, shows model loading) -->
  <path d="M 910 230 L 910 200 L 725 200 L 725 170" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="820" y="195" font-family="Arial" font-size="8" fill="#16a34a" text-anchor="middle">modelo carregado no arranque</text>

  <!-- Key insight box -->
  <rect x="500" y="300" width="440" height="50" rx="4" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="720" y="320" font-family="Arial" font-size="10" font-weight="bold" fill="#854d0e" text-anchor="middle">Princípio fundamental: o mesmo NFStream config (active_timeout=10s, BPF tcp port 8883)</text>
  <text x="720" y="338" font-family="Arial" font-size="10" fill="#a16207" text-anchor="middle">é usado no treino offline E na inferência live → zero train/serve skew</text>

  <!-- Footer -->
  <text x="480" y="390" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">Eduardo Queirós · Francisco Mota · Tiago Campos — Universidade do Minho, 2025</text>
</svg>
